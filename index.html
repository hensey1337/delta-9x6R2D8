<script>
    // Полноценный и быстрый загрузчик по текстовым именам вкладок
    const SPREADSHEET_ID = '1eCCexMp399TImDlQDFDPyyzgZNkhn0nqGJvsTndruNQ';
    
    // Ссылки на получение CSV по точным названиям листов, как у тебя в таблице
    const URL_BLACKLIST = `https://google.com{SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Blacklist`;
    const URL_STRATEGY = `https://google.com{SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Strategy`;

    // Функция для простой очистки кавычек Гугла
    function clean(val) {
        if (!val) return '';
        return val.replace(/^"|"$/g, '').trim();
    }

    // Парсер CSV формата, который делает всё сам без сторонних библиотек
    function parseCSV(text) {
        const lines = text.split('\n');
        if (lines.length === 0) return [];
        
        // Читаем заголовки колонок
        const headers = lines[0].split(',').map(h => clean(h).toLowerCase());
        const result = [];
        
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            
            // Защита от запятых внутри ячеек (разбиваем с учетом кавычек)
            const matches = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
            const row = {};
            
            headers.forEach((header, index) => {
                row[header] = matches[index] ? clean(matches[index]) : '';
            });
            result.push(row);
        }
        return result;
    }

    // Загружаем Черный Список
    fetch(URL_BLACKLIST)
        .then(res => res.text())
        .then(text => {
            const data = parseCSV(text);
            const tbody = document.getElementById('blacklist-body');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color: var(--text-muted);">Черный список пуст</td></tr>`;
                return;
            }

            data.forEach(row => {
                // Ищем колонку независимо от регистра букв
                const nickname = row.nickname || row.Nickname;
                if (!nickname) return;
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="nickname">❌ ${nickname}</td>
                    <td><span class="badge">${row.setup || '—'}</span></td>
                    <td style="color: var(--text-muted);">${row.reason || '—'}</td>
                `;
                tbody.appendChild(tr);
            });
        })
        .catch(() => {
            document.getElementById('blacklist-body').innerHTML = `<tr><td colspan="3" class="error-msg">Ошибка загрузки Blacklist. Проверьте права доступа.</td></tr>`;
        });

    // Загружаем Основную Стратегию
    fetch(URL_STRATEGY)
        .then(res => res.text())
        .then(text => {
            const data = parseCSV(text);
            const container = document.getElementById('strategy-container');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = `<p style="text-align:center; color: var(--text-muted);">Стратегия еще не заполнена</p>`;
                return;
            }

            data.forEach(row => {
                const group = row.group || row.Group;
                if (!group) return;
                
                const card = document.createElement('div');
                card.className = 'strategy-card';
                
                let targetsHtml = '';
                const t1 = row.target1 || '';
                const t2 = row.target2 || '';
                const squads = row.squads || '';
                const notes = row.notes || '';
                
                if (t1 && t1 !== '—') {
                    targetsHtml += `<div class="target-block"><span class="target-label">🎯 ЦЕЛЬ №1:</span> <span class="target-name target-primary">${t1}</span></div>`;
                }
                if (t2 && t2 !== '—') {
                    targetsHtml += `<div class="target-block"><span class="target-label">🔄 ЦЕЛЬ №2:</span> <span class="target-name target-secondary">${t2}</span></div>`;
                }

                // Вытаскиваем колонку состава групп (group composition)
                const compText = row['group composition'] || '';
                const compHtml = compText ? `<div class="group-comp">[ ${compText} ]</div>` : '';

                card.innerHTML = `
                    <div class="card-header-row">
                        <div class="group-info">
                            <div class="group-title">${group}</div>
                            ${compHtml}
                        </div>
                        <div class="squads-list">${squads || '—'}</div>
                    </div>
                    <div class="card-body-content">
                        <div class="targets-zone">${targetsHtml || '<span style="color:var(--text-muted); font-style:italic;">Свободная охота / Резерв</span>'}</div>
                        <div class="notes-zone">${notes || '—'}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        })
        .catch(() => {
            document.getElementById('strategy-container').innerHTML = `<div class="error-msg" style="text-align:center; padding: 20px;">Ошибка загрузки тактической схемы.</div>`;
        });
</script>
