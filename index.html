/* ============================================================
   ANTI-ZERG — общий стиль
   ============================================================ */

:root{
  --bg:#07080a;
  --bg-soft:#0c0d10;
  --panel:#0f1013;
  --panel-2:#131418;
  --line:rgba(255,255,255,.075);
  --line-strong:rgba(255,255,255,.15);
  --txt:#ececee;
  --txt-dim:#b6b8bd;
  --muted:#7e8187;

  --dd:#ff7a45;
  --tank:#5b9cff;
  --heal:#3fcf8e;

  --r:14px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}

html{-webkit-text-size-adjust:100%}

body{
  min-height:100vh;
  background:
    radial-gradient(1100px 560px at 50% -14%, rgba(255,255,255,.05), transparent 68%),
    var(--bg);
  color:var(--txt);
  font-family:var(--font);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  padding-bottom:70px;
}

/* точечная сетка как в референсе канваса */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:radial-gradient(rgba(255,255,255,.11) 1px, transparent 1px);
  background-size:24px 24px;
  opacity:.5;
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%, #000 0%, transparent 78%);
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%, #000 0%, transparent 78%);
  pointer-events:none;
  z-index:0;
}

.wrap{
  position:relative;
  z-index:1;
  max-width:1180px;
  margin:0 auto;
  padding:0 22px;
}

/* ---------------- верхняя панель ---------------- */

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:16px;
  padding:16px 0 14px;
  margin-bottom:26px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(7,8,10,.94), rgba(7,8,10,.72));
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.back{
  display:inline-flex;
  align-items:center;
  gap:8px;
  height:36px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.025);
  color:var(--txt-dim);
  font-size:13px;
  font-weight:500;
  text-decoration:none;
  letter-spacing:.01em;
  transition:all .18s ease;
  white-space:nowrap;
}
.back:hover{
  color:var(--txt);
  border-color:var(--line-strong);
  background:rgba(255,255,255,.06);
  transform:translateX(-2px);
}
.back svg{width:14px;height:14px;flex:none}

.topbar__title{
  font-size:13px;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
  margin-left:auto;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ---------------- главная ---------------- */

.home-page{
  overflow:hidden;
  height:100vh;
  height:100svh;
}

.home{
  position:relative;
  isolation:isolate;
  min-height:100vh;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:clamp(6vh, 11vh, 130px) 20px 0;
  overflow:hidden;
}

/* затемнение: сверху глухое под текст, к низу открываем кота */
.home__veil{
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    linear-gradient(180deg,
      rgba(4,5,7,.97) 0%,
      rgba(4,5,7,.92) 16%,
      rgba(4,5,7,.70) 34%,
      rgba(4,5,7,.28) 54%,
      rgba(4,5,7,.06) 72%,
      rgba(4,5,7,.50) 100%),
    radial-gradient(120% 62% at 50% 6%, rgba(0,0,0,.78) 0%, rgba(0,0,0,0) 72%),
    radial-gradient(95% 50% at 50% 100%, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 62%);
}

.home__inner{
  position:relative;
  z-index:1;
  width:100%;
  max-width:820px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.home__title{
  font-size:clamp(1.5rem, 3.6vw, 2.55rem);
  font-weight:700;
  letter-spacing:.02em;
  text-align:center;
  text-transform:uppercase;
  line-height:1.15;
  text-shadow:0 2px 34px rgba(0,0,0,.95), 0 0 90px rgba(255,255,255,.08);
}

.home__title span{color:var(--txt)}
.home__title b{
  font-weight:700;
  background:linear-gradient(180deg,#fff,#9aa0ab);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.home__sub{
  margin-top:12px;
  font-size:12px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--txt-dim);
  text-align:center;
  text-shadow:0 2px 22px rgba(0,0,0,.95);
}

.btn-grid{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  margin-top:clamp(26px, 4.2vh, 44px);
  max-width:760px;
  width:100%;
}

/* стеклянные кнопки поверх фото */
.btn{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:50px;
  padding:0 26px;
  min-width:168px;
  border:1px solid rgba(255,255,255,.24);
  border-radius:11px;
  background:linear-gradient(180deg, rgba(20,21,25,.60), rgba(10,11,14,.50));
  -webkit-backdrop-filter:blur(14px) saturate(130%);
  backdrop-filter:blur(14px) saturate(130%);
  color:#fff;
  font-size:13px;
  font-weight:600;
  letter-spacing:.11em;
  text-transform:uppercase;
  text-decoration:none;
  text-align:center;
  transition:transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
  box-shadow:0 1px 0 rgba(255,255,255,.09) inset, 0 14px 30px -18px rgba(0,0,0,.95);
  overflow:hidden;
}
.btn::after{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(120px 60px at 50% 0%, rgba(255,255,255,.20), transparent 70%);
  opacity:0;
  transition:opacity .2s ease;
}
.btn:hover{
  transform:translateY(-2px);
  border-color:rgba(255,255,255,.48);
  background:linear-gradient(180deg, rgba(42,44,50,.78), rgba(20,21,25,.66));
  box-shadow:0 1px 0 rgba(255,255,255,.14) inset, 0 18px 36px -18px rgba(0,0,0,1);
}
.btn:hover::after{opacity:1}
.btn:active{transform:translateY(0)}

.btn--wide{min-width:236px}

/* ---------------- заголовок раздела ---------------- */

.section-head{
  display:flex;
  align-items:baseline;
  gap:14px;
  flex-wrap:wrap;
  margin:6px 0 22px;
}
.section-head h1{
  font-size:20px;
  font-weight:650;
  letter-spacing:.06em;
  text-transform:uppercase;
}
.section-head .count{
  font-size:12px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
  border:1px solid var(--line);
  border-radius:999px;
  padding:3px 10px;
}

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:16px;
  margin:0 0 24px;
  font-size:12px;
  color:var(--muted);
  letter-spacing:.03em;
}
.legend i{
  display:inline-block;
  width:8px;height:8px;
  border-radius:50%;
  margin-right:7px;
  vertical-align:middle;
}
.legend .l-dd i{background:var(--dd);box-shadow:0 0 10px -1px var(--dd)}
.legend .l-tank i{background:var(--tank);box-shadow:0 0 10px -1px var(--tank)}
.legend .l-heal i{background:var(--heal);box-shadow:0 0 10px -1px var(--heal)}

/* ---------------- карточки пачек ---------------- */

.squad-grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(0,1fr));
  gap:20px;
}

.squad{
  position:relative;
  border:1px solid var(--line);
  border-radius:var(--r);
  background:rgba(255,255,255,.014);
  overflow:hidden;
  box-shadow:0 20px 50px -40px #000;
}

.squad__head{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 16px;
  border-bottom:1px solid hsla(var(--h,220), 40%, 70%, .18);
  background:
    linear-gradient(135deg, hsla(var(--h,220), 42%, 62%, .20), hsla(var(--h,220), 42%, 62%, .045) 62%);
  backdrop-filter:blur(14px) saturate(130%);
  -webkit-backdrop-filter:blur(14px) saturate(130%);
}
.squad__head::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,.14), transparent 60%);
  opacity:.5;
  pointer-events:none;
}

.squad__num{
  font-size:19px;
  font-weight:600;
  font-style:italic;
  line-height:1;
  color:#fff;
  opacity:.92;
  min-width:30px;
  font-variant-numeric:tabular-nums;
}
.squad__name{
  font-size:12px;
  font-weight:600;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:rgba(255,255,255,.86);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.squad__count{
  margin-left:auto;
  font-size:11px;
  letter-spacing:.08em;
  color:rgba(255,255,255,.55);
  white-space:nowrap;
}

.squad__rows{display:flex;flex-direction:column}

.row{
  display:grid;
  grid-template-columns:28px minmax(0,1fr) 128px auto;
  align-items:center;
  gap:10px;
  padding:9px 16px;
  border-bottom:1px solid rgba(255,255,255,.045);
  min-height:42px;
}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(255,255,255,.028)}
.row--empty{opacity:.42}

.row__i{
  font-size:11px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  text-align:center;
}
.row__nick{
  font-size:14px;
  font-weight:550;
  color:var(--txt);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.row__nick.is-empty{color:var(--muted);font-weight:400;font-style:italic}

.row__gs{
  font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  font-size:12.5px;
  font-weight:600;
  color:#f0c419;
  text-align:right;
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
}

/* ---------------- классы ---------------- */

.cls{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:26px;
  padding:0 10px;
  border-radius:6px;
  font-size:11px;
  font-weight:650;
  letter-spacing:.09em;
  text-transform:uppercase;
  white-space:nowrap;
  border:1px solid transparent;
}
.cls--dd{
  color:#ffb08a;
  background:rgba(255,122,69,.14);
  border-color:rgba(255,122,69,.32);
}
.cls--tank{
  color:#a8c8ff;
  background:rgba(91,156,255,.14);
  border-color:rgba(91,156,255,.32);
}
.cls--heal{
  color:#8ee7bf;
  background:rgba(63,207,142,.14);
  border-color:rgba(63,207,142,.32);
}
.cls--none{
  color:var(--txt-dim);
  background:rgba(255,255,255,.04);
  border-color:var(--line);
}
/* длинный текст в колонке «сетап» — без капса и рамки */
.cls--text{
  height:auto;
  padding:3px 9px;
  text-transform:none;
  letter-spacing:0;
  font-size:12px;
  font-weight:500;
  line-height:1.45;
  white-space:normal;
  text-align:left;
  color:var(--txt-dim);
  background:rgba(255,255,255,.035);
  border-color:rgba(255,255,255,.09);
}

/* ---------------- таблицы ---------------- */

.panel{
  border:1px solid var(--line);
  border-radius:var(--r);
  background:rgba(255,255,255,.016);
  overflow:hidden;
  box-shadow:0 24px 60px -48px #000;
}

.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

table.data{
  width:100%;
  border-collapse:collapse;
  min-width:620px;
}
table.data thead th{
  padding:13px 18px;
  text-align:left;
  font-size:10.5px;
  font-weight:650;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
  background:rgba(255,255,255,.028);
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
table.data tbody td{
  padding:13px 18px;
  border-bottom:1px solid rgba(255,255,255,.045);
  vertical-align:middle;
  font-size:13.5px;
  color:var(--txt-dim);
}

<body class="home-page">
<div id="app"></div>
<script>
/* ==========================================================================
   ANTI-ZERG — однофайловое приложение
   ========================================================================== */

const PUB_KEY = '2PACX-1vSAdKvnDfusW0YrdnJgV3Wd3swPgFvKJRmSSQ1zc0aN2mxuBPpu2DvqzSwDnJqPeBHvFFV57e_ZJnR8';

const SHEETS = {
  qwe:       { gid: '1505585512', title: 'QWE',       sub: 'состав · гирскор', gs: true  },
  dd:        { gid: '643049503',  title: 'DD',        sub: 'состав · гирскор', gs: true  },
  dark1:     { gid: '993416369',  title: '1DARKNES',  sub: 'состав',           gs: false },
  dark11:    { gid: '1257870261', title: '11DARKNES', sub: 'состав',           gs: false },
  blacklist: { gid: '0',          title: 'Антиприоритетные таргеты', sub: 'блэклист' },
  targets:   { gid: '1730228249', title: 'Приоритетные таргеты',     sub: 'первая волна' },
  strategy:  { gid: '2058197677', title: 'Стратегия / Пояснение',    sub: 'двойки и связи' }
};

/* ======================= утилиты ======================= */

const clean = v => (v || '').replace(/^\uFEFF/, '').replace(/\s+/g, ' ').trim();
const norm  = v => clean(v).toLowerCase().replace(/[\s/\\|.\-]+/g, '');
const $     = s => document.querySelector(s);

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function parseCSV(text) {
  const rows = [];
  let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') {
        if (text[i + 1] === '"') { cur += '"'; i++; } else q = false;
      } else cur += c;
      continue;
    }
    if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

const cache = new Map();

async function fetchSheet(key) {
  if (cache.has(key)) return cache.get(key);
  const url = `https://docs.google.com/spreadsheets/d/e/${PUB_KEY}/pub`
            + `?output=csv&gid=${SHEETS[key].gid}&cb=${Date.now()}`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`Google ответил ${res.status}`);
  const rows = parseCSV(await res.text());
  cache.set(key, rows);
  return rows;
}

/* ======================= классы ======================= */

const NICK_KEYS = ['nickname', 'nick', 'никнейм', 'ник', 'имя'];
const CLS_KEYS  = ['class', 'класс', 'специализация', 'роль'];
const GS_KEYS   = ['gs', 'гирскор', 'гс'];
const TXT_KEYS  = ['comment', 'комментарий', 'коммент', 'заметка', 'notes',
                   'setup', 'сетап', 'причина', 'reason'];

const isNickKey = v => NICK_KEYS.includes(norm(v));
const isClsKey  = v => CLS_KEYS.includes(norm(v));
const isGsKey   = v => GS_KEYS.includes(norm(v));
const isTxtKey  = v => TXT_KEYS.includes(norm(v));
const isHeaderKey = v => isNickKey(v) || isClsKey(v) || isGsKey(v) || isTxtKey(v)
  || ['group', 'группа', 'двойка', 'пачка', 'squads', 'target1', 'target2'].includes(norm(v));

const WEAPONS = [
  'SNS', 'GS', 'SPEAR', 'DAGGER', 'BOW', 'WAND', 'STAFF', 'XBOW', 'CROSSBOW',
  'HALBERD', 'SHIELD', 'HOLY', 'NATURE', 'ARCANE', 'FIRE', 'FROST', 'CURSE', 'GLAIVE',
  'КОРД', 'ЛУК', 'ЖЕЗЛ', 'КОПЬЁ', 'КОПЬЕ', 'ЩИТ', 'КИНЖАЛ', 'МЕЧ', 'АРБАЛЕТ', 'ПОСОХ'
];

function looksLikeClass(cls) {
  const t = clean(cls).toUpperCase();
  if (!t || t.length > 28) return false;
  return WEAPONS.some(w => t.includes(w));
}

function classKind(cls) {
  const raw = clean(cls);
  if (!raw || !looksLikeClass(raw)) return 'none';
  const t = raw.toUpperCase().replace(/[\s\-_]+/g, '');
  const has = s => t.includes(s);

  if (has('BOW') && has('WAND')) return 'heal';
  if (has('SNS') && (has('WAND') || has('GS'))) return 'tank';
  if (has('HOLY') || has('NATURE')) return 'heal';
  if (has('WAND') && !has('SNS')) return 'heal';
  return 'dd';
}

function classBadge(cls, allowLong) {
  const raw = clean(cls);
  if (!raw) return '<span class="cls cls--none">—</span>';
  const k = classKind(raw);
  const extra = (k === 'none' && allowLong) ? ' cls--text' : '';
  return `<span class="cls cls--${k}${extra}">${esc(raw)}</span>`;
}

/* ======================= пачки ======================= */

const TITLE_RE  = /(кп|group|пачка|squad|отряд|состав)/i;
const IMPORTANT = /(важно|important|приоритет)/i;

function squadMeta(title) {
  const t = clean(title);
  const m = t.match(/(\d{1,2})/);
  const num = m ? m[1] : '';
  let name = t;
  if (num) name = t.replace(new RegExp(`^\\D{0,12}?${num}\\s*`, 'i'), '');
  name = name.replace(/^[\s\-–—:.,]+|[\s\-–—:.,]+$/g, '');
  if (!name || name.length < 2) name = num ? `Пачка ${num}` : 'Пачка';
  return { num, name, important: IMPORTANT.test(t) };
}

function parseGrid(rows) {
  const blocks = [], out = [];

  const findTitles = cells => cells.reduce((acc, c, i) => {
    if (clean(c) && TITLE_RE.test(clean(c)) && !isHeaderKey(c)) acc.push(i);
    return acc;
  }, []);

  rows.forEach(cells => {
    if (!cells || !cells.length) return;
    const titles = findTitles(cells);

    if (titles.length) {
      titles.forEach(base => {
        const squad = { ...squadMeta(cells[base]), members: [] };
        out.push(squad);
        blocks.push({ base, squad, cols: { nick: 0, cls: 1, gs: 2 } });
      });
      return;
    }

    let headerSeen = false;
    blocks.forEach(b => {
      const cellsOfBlock = [];
      for (let k = b.base; k < b.base + 5 && k < cells.length; k++) {
        cellsOfBlock.push({ k, v: cells[k] });
      }
      if (!cellsOfBlock.some(c => isNickKey(c.v) || isClsKey(c.v))) return;
      headerSeen = true;

      const off = key => {
        const hit = cellsOfBlock.find(c => key(c.v));
        return hit ? hit.k - b.base : null;
      };
      const nick = off(isNickKey);
      const cls  = off(isClsKey);
      const gs   = off(isGsKey) ?? off(isTxtKey);
      if (nick !== null) b.cols.nick = nick;
      if (cls  !== null) b.cols.cls  = cls;
      if (gs   !== null) b.cols.gs   = gs;
    });
    if (headerSeen) return;

    blocks.forEach(b => {
      const get = name => {
        const idx = b.base + (b.cols[name] ?? 0);
        return idx < cells.length ? clean(cells[idx]) : '';
      };
      const nick = get('nick'), cls = get('cls'), gs = get('gs');
      if (!nick && !cls) return;
      if (isHeaderKey(nick)) return;
      if (TITLE_RE.test(nick) && !cls) return;
      b.squad.members.push({ nick, cls, gs });
    });
  });

  out.forEach(s => {
    while (s.members.length < 6) s.members.push({ nick: '', cls: '', gs: '' });
    s.members = s.members.slice(0, 6);
  });

  return out.filter(s => s.members.some(m => m.nick || m.cls));
}

function parseRecords(rows) {
  if (!rows.length) return [];
  let start = 0;
  if ((rows[0] || []).some(c => isHeaderKey(c))) start = 1;

  const out = [];
  for (let i = start; i < rows.length; i++) {
    const r = rows[i] || [];
    const nick = clean(r[0]);
    if (!nick || isHeaderKey(nick) || TITLE_RE.test(nick)) continue;
    out.push({ nick, cls: clean(r[1]), reason: clean(r[2]) });
  }
  return out;
}

function parseStrategy(rows) {
  if (!rows.length) return [];
  let start = 0;
  if (/group|группа|двойка|пачка/i.test(clean((rows[0] || [])[0]))) start = 1;

  const out = [];
  for (let i = start; i < rows.length; i++) {
    const r = rows[i] || [];
    const group = clean(r[0]);
    if (!group) continue;
    const rec = { group, comp: clean(r[1]), squads: clean(r[2]),
                  t1: clean(r[3]), t2: clean(r[4]), notes: clean(r[5]) };
    if (!/[\p{L}\p{N}]/u.test(rec.t1 + rec.t2 + rec.notes)) continue;
    out.push(rec);
  }
  return out;
}

async function buildNameMap() {
  const map = new Map();
  await Promise.all(['qwe', 'dd', 'dark1', 'dark11'].map(async k => {
    try {
      parseGrid(await fetchSheet(k)).forEach(s => s.members.forEach(m => {
        if (m.nick && m.cls) map.set(m.nick.toLowerCase(), m.cls);
      }));
    } catch (e) { /* не критично */ }
  }));
  return map;
}

/* ======================= вьюхи ======================= */

function viewHome() {
  return `
<div class="home">
  <div class="home__bg" aria-hidden="true"></div>
  <div class="home__veil" aria-hidden="true"></div>

    <nav class="btn-grid" aria-label="Разделы">
      <a class="btn" href="#qwe">QWE</a>
      <a class="btn" href="#dd">DD</a>
      <a class="btn" href="#dark1">1Darknes</a>
      <a class="btn" href="#dark11">11Darknes</a>
      <a class="btn" href="#blacklist">Антиприоритетные таргеты</a>

    </nav>
  </div>
</div>`;
}

function viewShell(key, body) {
  const m = SHEETS[key];
  return `
<div class="wrap">
  <header class="topbar">
    <a class="back" href="#">${ARROW}<span>Назад</span></a>

  </header>

  <div class="section-head">
    <h1>${esc(m.title)}</h1>

  </div>
${m.gs !== undefined ? `
  <div class="legend">
    <span class="l-dd"><i></i>урон</span>
    <span class="l-tank"><i></i>танк</span>

}

const loading = '<div class="state"><span class="spinner"></span>Синхронизация с таблицей…</div>';

function errorBlock(err) {
  if (location.protocol === 'file:') {
    return `<div class="state state--error">
      <b>Файл открыт с компьютера — данные не подгрузить.</b><br><br>
      Браузер блокирует такие запросы из локального файла.
      Залей файл на GitHub Pages — там всё работает.</div>`;
  }
  return `<div class="state state--error">
    Не удалось загрузить данные: ${esc(err.message)}<br>
    Проверь, что таблица опубликована в интернете.</div>`;
}

function squadsHTML(squads, withGs) {
  if (!squads.length) return '<div class="state">В таблице пока нет заполненных пачек.</div>';

  return `<div class="squad-grid">${squads.map((sq, idx) => {
    const hue = sq.num ? (parseInt(sq.num, 10) * 43) % 360 : 215;
    const rows = sq.members.map((m, i) => `
      <div class="row${withGs ? ' is-gs' : ''}${m.nick ? '' : ' row--empty'}">
        <span class="row__i">${i + 1}</span>
        <span class="row__nick${m.nick ? '' : ' is-empty'}">${m.nick ? esc(m.nick) : 'свободно'}</span>
        ${classBadge(m.cls)}
        ${withGs ? `<span class="row__gs">${m.gs ? esc(m.gs) : '—'}</span>` : ''}
      </div>`).join('');

    return `
    <section class="squad fade-up" style="--h:${hue};animation-delay:${Math.min(idx * 40, 320)}ms">
      <div class="squad__head">
        <span class="squad__num">${esc(sq.num || '—')}</span>
        <span class="squad__name">${esc(sq.name)}</span>
        <span class="squad__count">${sq.members.filter(m => m.nick).length} чел.</span>
      </div>
      <div class="squad__rows">${rows}</div>
    </section>`;
  }).join('')}</div>`;
}

function recordsHTML(records, targetMark, reasonLabel) {
  if (!records.length) return '<div class="state">В таблице пока нет данных.</div>';

  const mark = targetMark
    ? '<span class="mark mark--t">◎</span>'
    : '<span class="mark mark--x">✕</span>';

  return `
  <div class="panel">
    <div class="table-scroll">
      <table class="data">
        <thead><tr>
          <th></th><th>Никнейм</th><th>Класс</th><th>${reasonLabel}</th>
        </tr></thead>
        <tbody>${records.map(r => `
          <tr>
            <td class="num"></td>
            <td class="nick">${mark}${esc(r.nick)}</td>
            <td>${classBadge(r.cls, true)}</td>
            <td class="reason">${r.reason ? esc(r.reason) : '—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function strategyHTML(records) {
  if (!records.length) return '<div class="state">В таблице пока нет данных.</div>';

  return `<div class="strategy-list">${records.map((r, idx) => {
    const t1 = r.t1 ? `<span class="target target--1"><span class="target__lbl">цель 1</span>${esc(r.t1)}</span>` : '';
    const t2 = r.t2 ? `<span class="target target--2"><span class="target__lbl">цель 2</span>${esc(r.t2)}</span>` : '';
    const sep = (t1 && t2) ? '<span class="target-sep">→</span>' : '';
    const targets = (t1 || t2) ? t1 + sep + t2 : '<span class="target-sep">свободная охота</span>';

    return `
    <article class="scard fade-up" style="animation-delay:${Math.min(idx * 50, 400)}ms">
      <div class="scard__top">
        <span class="scard__group">${esc(r.group)}</span>
        ${r.comp ? `<span class="scard__comp">${esc(r.comp)}</span>` : ''}
        ${r.squads ? `<span class="scard__squads">${esc(r.squads)}</span>` : ''}
      </div>
      <div class="scard__body">
        <div class="targets">${targets}</div>
        <div class="scard__notes${r.notes ? '' : ' is-empty'}">${r.notes ? esc(r.notes) : 'без пояснения'}</div>
      </div>
    </article>`;
  }).join('')}</div>`;
}

/* диаграмма связей */

const NODE_W = 216, NODE_H = 62, COL_X = [24, 388, 752], BAND = 128, PAD_T = 16;

function wrapText(str, max) {
  const words = String(str).split(/\s+/);
  const lines = [];
  let line = '';
  words.forEach(w => {
    if (!line.length) line = w;
    else if ((line + ' ' + w).length <= max) line += ' ' + w;
    else { lines.push(line); line = w; }
  });
  if (line) lines.push(line);
  return lines.slice(0, 3);
}

function nodeMarkup(col, row, lines, cls, shared) {
  const x = COL_X[col], y = PAD_T + row * BAND;
  const badge = cls ? `<span class="dg-badge dg-${classKind(cls)}">${esc(cls)}</span>` : '';
  const count = shared > 1 ? `<span class="dg-count">×${shared}</span>` : '';
  const inner = lines.map(l => `<div class="dg-line">${esc(l)}</div>`).join('');

  return `<foreignObject x="${x}" y="${y}" width="${NODE_W}" height="${NODE_H}">
    <div xmlns="http://www.w3.org/1999/xhtml" class="dg-node${shared > 1 ? ' dg-node--shared' : ''}">
      <div class="dg-title">${inner}</div>${badge}${count}
    </div></foreignObject>`;
}

function arrowMarkup(x1, y1, x2, y2) {
  const bend = Math.max(38, Math.abs(x2 - x1) * 0.45);
  return `<path d="M ${x1} ${y1} C ${x1 + bend} ${y1}, ${x2 - bend} ${y2}, ${x2} ${y2}"
    class="dg-arrow" marker-end="url(#dg-arrowhead)"/>`;
}

function diagramHTML(records, nameMap) {
  if (!records.length) return '';

  const counts = new Map();
  records.forEach(r => [r.t1, r.t2].forEach(t => {
    if (!t) return;
    const k = t.toLowerCase();
    counts.set(k, (counts.get(k) || 0) + 1);
  }));

  let svg = '', band = 0;

  records.forEach(r => {
    const row = band++;
    svg += nodeMarkup(0, row, wrapText(r.squads || r.group, 22), '', 1);

    if (r.t1) {
      const cls = nameMap.get(r.t1.toLowerCase());
      svg += nodeMarkup(1, row, wrapText(r.t1, 20), cls, counts.get(r.t1.toLowerCase()) || 1);
      svg += arrowMarkup(COL_X[0] + NODE_W + 8, PAD_T + row * BAND + NODE_H / 2,
                         COL_X[1] - 8,       PAD_T + row * BAND + NODE_H / 2);
    }
    if (r.t2) {
      const cls = nameMap.get(r.t2.toLowerCase());
      svg += nodeMarkup(2, row, wrapText(r.t2, 20), cls, counts.get(r.t2.toLowerCase()) || 1);
      const fromX = COL_X[r.t1 ? 1 : 0] + NODE_W + 8;
      svg += arrowMarkup(fromX, PAD_T + row * BAND + NODE_H / 2,
                         COL_X[2] - 8, PAD_T + row * BAND + NODE_H / 2);
    }
  });

  const height = PAD_T * 2 + band * BAND + 8;
  const width = COL_X[2] + NODE_W + 24;

  return `
  <div class="diagram">
    <div class="diagram__head">
      <h2>Связи целей</h2>
      <span class="diagram__hint">двойка → цель 1 → цель 2</span>
    </div>
    <div class="diagram__canvas">
      <svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="Схема связей целей">
        <defs>
          <marker id="dg-arrowhead" viewBox="0 0 10 10" refX="8" refY="5"
                  markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" class="dg-head"/>
          </marker>
        </defs>
        ${svg}
      </svg>
    </div>
  </div>`;
}

/* ======================= загрузка данных ======================= */

const setCount = t => { const el = $('#count'); if (el) el.textContent = t; };

async function loadSquads(key) {
  const m = SHEETS[key];
  try {
    const squads = parseGrid(await fetchSheet(key));
    if (!squads.length) { $('#content').innerHTML = '<div class="state">Пачки пока не заполнены.</div>'; setCount(''); return; }
    $('#content').innerHTML = squadsHTML(squads, m.gs);
    const people = squads.reduce((n, s) => n + s.members.filter(x => x.nick).length, 0);
    setCount(`${squads.length} пачек · ${people} чел.`);
  } catch (e) {
    $('#content').innerHTML = errorBlock(e);
  }
}

async function loadRecords(key) {
  try {
    const records = parseRecords(await fetchSheet(key));
    const isTargets = key === 'targets';
    $('#content').innerHTML = recordsHTML(records, isTargets, isTargets ? 'Причина' : 'Комментарий');
    setCount(`${records.length} чел.`);
  } catch (e) {
    $('#content').innerHTML = errorBlock(e);
  }
}

async function loadStrategy() {
  try {
    const records = parseStrategy(await fetchSheet('strategy'));
    const map = await buildNameMap();
    $('#content').innerHTML = strategyHTML(records) + diagramHTML(records, map);
    setCount(`${records.length} двоек`);
  } catch (e) {
    $('#content').innerHTML = errorBlock(e);
  }
}

/* ======================= роутер ======================= */

const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>';

const app = () => $('#app');

function currentRoute() {
  const h = (location.hash || '').replace(/^#\/?/, '').trim();
  return h || 'home';
}

function render() {
  const route = currentRoute();
  window.scrollTo(0, 0);

  if (route === 'home' || !SHEETS[route]) {
    document.body.className = 'home-page';
    document.title = 'Операция «Анти-Зерг»';
    app().innerHTML = viewHome();
    return;
  }

  document.body.className = 'page';
  const m = SHEETS[route];
  document.title = `${m.title} — АНТИ-ЗЕРГ`;
  app().innerHTML = viewShell(route, loading);

  if (route === 'strategy') loadStrategy();
  else if (route === 'blacklist' || route === 'targets') loadRecords(route);
  else loadSquads(route);
}

window.addEventListener('hashchange', render);
document.addEventListener('DOMContentLoaded', render);

</script>
